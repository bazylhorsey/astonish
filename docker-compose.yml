version: '3.8'

services:
  astonish_server:
    container_name: astonish_server
    build: ./backend
    restart: always
    command: "sh -c 'alembic upgrade head && uvicorn app.main:app --reload --workers 1 --host 0.0.0.0 --port 80'"
    #command: "sh -c 'alembic upgrade head && gunicorn -w 3 -k uvicorn.workers.UvicornWorker app.main:app  --bind 0.0.0.0:80 --preload --log-level=debug --timeout 120'"
    volumes:
      - ./backend/app:/code
    ports:
      - 80:80
    env_file: ".env"
    depends_on:
      - database

  redis_server:
    image: redis:alpine
    container_name: astonish_redis_server    
    restart: always
    expose:
      - 6379
    env_file: .env

  database:
    image: bitnami/postgresql:13.3.0
    restart: always
    container_name: astonish_database
    env_file: ".env"
    user: root
    volumes:
      - ./db_docker:/bitnami/postgresql
      - ./create-dbs.sql:/docker-entrypoint-initdb.d/create-dbs.sql
    ports:
      - 5454:5432 # Remove this on production
    expose:
      - 5432
    environment:
      - POSTGRES_USERNAME=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DATABASE=${DATABASE_NAME}
      - POSTGRES_HOST_AUTH_METHOD= "trust"

version: '3.8'

services:
  astonish_server:
    container_name: astonish_server
    build: ./backend
    restart: always
    command: "sh -c 'uvicorn app.main:app --reload --workers 1 --host 0.0.0.0 --port 80'"
    #command: "sh -c 'gunicorn -w 3 -k uvicorn.workers.UvicornWorker app.main:app  --bind 0.0.0.0:8000 --preload --log-level=debug --timeout 120'"
    volumes:
      - ./backend/app:/code
    ports:
      - 80:80
    env_file: ".env"

